<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title><!--UNFOLD:TITLE--></title>
<style>
  :root {
    --ink: #1b1b21;
    --ink-soft: #4a4a55;
    --ink-faint: #8b8b96;
    --paper: #fbfaf7;
    --paper-raised: #ffffff;
    --line: #e7e3d8;
    --line-soft: #efece4;
    --accent: #2f5fd0;
    --accent-soft: #e8eefc;
    --amber: #b4622a;
    --amber-soft: #fbf0e6;
    --green: #2f7d5d;
    --rail: 292px;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(27, 27, 33, .05), 0 8px 24px -12px rgba(27, 27, 33, .18);
    --serif: "Source Han Serif SC", "Songti SC", Georgia, "Noto Serif SC", "Times New Roman", serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15.5px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; border-bottom: 1px solid rgba(47, 95, 208, .25); }
  a:hover { border-bottom-color: var(--accent); }

  /* ---------- shell ---------- */
  .shell { display: flex; min-height: 100%; }
  .rail {
    position: fixed; inset: 0 auto 0 0; width: var(--rail);
    display: flex; flex-direction: column;
    padding: 26px 20px 18px 26px;
    border-right: 1px solid var(--line);
    background: linear-gradient(180deg, #fdfdfb, #f8f6f1 60%, #f7f4ee);
    z-index: 20;
  }
  .rail-brand { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .rail-brand b { font-family: var(--mono); font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
  .rail-brand span { font-size: 11px; color: var(--ink-faint); letter-spacing: .06em; }
  .rail-goal { font-size: 12.5px; color: var(--ink-soft); line-height: 1.6; margin: 10px 0 16px; padding-left: 10px; border-left: 2px solid var(--line); }
  .depth { display: flex; align-items: center; gap: 4px; margin-bottom: 14px; font-size: 11px; color: var(--ink-faint); }
  .depth button {
    width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--paper-raised); color: var(--ink-soft); font-size: 11px; cursor: pointer;
  }
  .depth button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .depth span { margin-right: 6px; letter-spacing: .04em; }

  #toc { flex: 1; overflow-y: auto; margin: 0 -8px; padding: 0 8px 8px; scrollbar-width: thin; }
  #toc ol { list-style: none; margin: 0; padding: 0; }
  #toc li { margin: 0; }
  #toc a {
    display: block; padding: 3.5px 8px 3.5px 10px; border: 0; border-radius: 7px;
    color: var(--ink-soft); font-size: 13px; line-height: 1.45;
    border-left: 2px solid transparent; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #toc a:hover { background: rgba(27, 27, 33, .05); color: var(--ink); }
  #toc a.lv-1 { font-weight: 600; color: var(--ink); margin-top: 10px; font-size: 13.5px; }
  #toc a.lv-2 { padding-left: 20px; }
  #toc a.lv-3 { padding-left: 32px; font-size: 12.5px; }
  #toc a.lv-4 { padding-left: 44px; font-size: 12.5px; color: var(--ink-faint); }
  #toc a.on { background: var(--accent-soft); color: var(--accent); border-left-color: var(--accent); }
  .rail-foot { border-top: 1px solid var(--line-soft); padding-top: 12px; margin-top: 10px; font-size: 11px; color: var(--ink-faint); line-height: 1.6; }
  .rail-foot b { color: var(--ink-soft); font-weight: 600; }

  main { margin-left: var(--rail); width: 100%; min-width: 0; padding: 44px 56px 160px; }
  .page { max-width: 780px; margin: 0 auto; }

  /* ---------- cover ---------- */
  .cover { margin-bottom: 40px; }
  .kicker { display: flex; gap: 10px; align-items: center; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); }
  .kicker i { display: block; width: 26px; height: 1px; background: var(--line); }
  h1.title {
    font-family: var(--serif); font-size: 40px; line-height: 1.24; margin: 14px 0 10px; font-weight: 600; letter-spacing: -.01em;
  }
  .subtitle { font-family: var(--serif); font-size: 18px; color: var(--ink-soft); margin: 0 0 22px; line-height: 1.6; }
  .banner { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
  .pill {
    display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px;
    background: var(--paper-raised); border: 1px solid var(--line); font-size: 12.5px; color: var(--ink-soft);
  }
  .pill b { color: var(--ink); font-weight: 600; }
  .pill.accent { background: var(--accent-soft); border-color: #cfdcfa; color: #23478f; }
  .pill.amber { background: var(--amber-soft); border-color: #f0dcc7; color: #8a4a1d; }

  .route { margin: 26px 0 8px; padding: 18px 20px 8px; background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius); }
  .route h3 { margin: 0 0 12px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); font-weight: 600; }
  .route ol { list-style: none; counter-reset: step; margin: 0; padding: 0; }
  .route li { counter-increment: step; position: relative; padding: 0 0 12px 36px; font-size: 13.5px; line-height: 1.6; }
  .route li::before {
    content: counter(step); position: absolute; left: 0; top: 1px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--ink); color: #fff; font-size: 11px; font-family: var(--mono); display: grid; place-items: center;
  }
  .route li small { display: block; color: var(--ink-faint); font-size: 12px; margin-top: 2px; }

  /* ---------- sections ---------- */
  article { counter-reset: sec; }
  .sec { margin: 46px 0 0; }
  .sec-head { position: relative; }
  .sec-head::before {
    content: ""; position: absolute; left: -18px; top: 6px; bottom: 6px; width: 3px; border-radius: 3px;
    background: linear-gradient(180deg, var(--accent), rgba(47, 95, 208, .12)); opacity: 0; transition: opacity .3s;
  }
  .sec[data-level="1"] .sec-head::before { opacity: 1; }
  h2.sec-title { font-family: var(--serif); font-size: 25px; line-height: 1.4; margin: 0 0 6px; font-weight: 600; letter-spacing: -.005em; }
  .sec[data-level="1"] h2.sec-title { counter-increment: sec; }
  .sec[data-level="1"] h2.sec-title::before {
    content: counter(sec, decimal-leading-zero) "  "; color: var(--accent); font-family: var(--mono); font-size: 14px;
    letter-spacing: .08em; vertical-align: 2px;
  }
  .sec[data-level="2"] h2.sec-title { font-size: 20px; margin-top: 10px; }
  .sec[data-level="3"] h2.sec-title, .sec[data-level="4"] h2.sec-title { font-size: 16.5px; font-family: var(--sans); font-weight: 650; }
  .sec-summary { font-size: 13px; color: var(--ink-faint); margin: 0 0 14px; padding-bottom: 10px; border-bottom: 1px dashed var(--line); }
  .sec[data-level="2"] { margin-top: 34px; }
  .sec[data-level="3"], .sec[data-level="4"] { margin-top: 24px; }

  .blk { position: relative; margin: 0 0 18px; transition: opacity .35s, transform .35s; }
  .blk.md-body { font-family: var(--serif); font-size: 17px; line-height: 1.85; color: #23232a; }
  .blk.md-body p { margin: 0 0 14px; }
  .blk strong { font-weight: 650; color: var(--ink); }
  .blk em { font-style: italic; }
  .blk code { font-family: var(--mono); font-size: .86em; background: #f2efe7; border-radius: 5px; padding: 1.5px 5px; }
  .blk pre { font-family: var(--mono); font-size: 12.5px; line-height: 1.7; background: #1f2027; color: #e9e7f0; padding: 16px 18px; border-radius: 12px; overflow-x: auto; margin: 0 0 18px; }
  .blk ul, .blk ol { margin: 0 0 16px; padding-left: 22px; }
  .blk li { margin: 4px 0; }
  .blk .math-i { font-family: var(--serif); font-style: italic; padding: 0 1px; }
  .blk blockquote { margin: 0 0 16px; padding: 4px 0 4px 18px; border-left: 2px solid var(--line); color: var(--ink-soft); font-style: italic; }

  .kind-key { background: var(--paper-raised); border: 1px solid #dfe8fb; border-left: 3px solid var(--accent); border-radius: 12px; padding: 16px 20px; box-shadow: var(--shadow); }
  .kind-key .tag, .kind-def .tag, .kind-ask .tag, .kind-note .tag {
    display: inline-block; font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 6px;
  }
  .kind-def { background: #f7f7fb; border: 1px solid #e3e3ef; border-radius: 12px; padding: 14px 18px; }
  .kind-def .tag { color: #5b4bb8; }
  .kind-ask { background: var(--amber-soft); border: 1px solid #f2e0cd; border-radius: 12px; padding: 14px 18px; }
  .kind-ask .tag { color: var(--amber); }
  .kind-note { font-size: 13.5px; color: var(--ink-soft); border-left: 2px solid var(--line); padding-left: 14px; font-family: var(--sans); }
  .kind-note .tag { color: var(--ink-faint); }
  .blk .formula { font-family: var(--serif); font-size: 19px; text-align: center; margin: 6px 0 10px; }

  .cite {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 17px; height: 17px; padding: 0 5px; margin: 0 2px; border-radius: 5px;
    background: var(--accent-soft); color: var(--accent);
    font-family: var(--mono); font-size: 10.5px; font-weight: 600; vertical-align: 2px;
    border: 1px solid #d3dffa; cursor: help; user-select: none;
  }
  .cite:hover, .cite.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  /* Citations the author did not place inline: the evidence still has to be reachable. */
  .cite-line { margin-top: 9px; font-family: var(--sans); font-size: 11.5px; color: var(--ink-faint); }
  .cite-line .cite { vertical-align: 0; }

  /* ---------- citation card ---------- */
  #citecard {
    position: fixed; z-index: 60; width: min(600px, calc(100vw - 40px));
    background: var(--paper-raised); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 18px 50px -18px rgba(20, 20, 30, .4), 0 2px 8px rgba(20, 20, 30, .08);
    overflow: hidden; opacity: 0; pointer-events: none; transform: translateY(6px) scale(.99);
    transition: opacity .16s ease, transform .16s ease;
  }
  #citecard.on { opacity: 1; pointer-events: auto; transform: none; }
  #citecard .cc-head { display: flex; align-items: center; gap: 8px; padding: 9px 13px; border-bottom: 1px solid var(--line-soft); font-size: 11.5px; color: var(--ink-faint); }
  #citecard .cc-head b { color: var(--ink-soft); font-weight: 600; }
  #citecard .cc-head .sp { flex: 1; }
  #citecard .cc-img { background: #fff; display: flex; justify-content: center; padding: 10px 12px; max-height: 56vh; overflow: auto; }
  #citecard .cc-img img { max-width: 100%; height: auto; border: 1px solid var(--line-soft); border-radius: 6px; }
  #citecard .cc-quote { margin: 0; padding: 10px 14px; font-family: var(--serif); font-size: 13px; line-height: 1.6; color: var(--ink-soft); border-top: 1px solid var(--line-soft); background: #fcfbf8; }
  #citecard .cc-quote:empty { display: none; }

  /* ---------- laser ---------- */
  #laser {
    position: fixed; z-index: 30; left: 0; top: 0; width: 10px; height: 10px; margin: -5px 0 0 -5px;
    border-radius: 50%; background: radial-gradient(circle, #ff6a5e, rgba(255, 70, 60, .15) 62%, transparent 70%);
    box-shadow: 0 0 12px 3px rgba(255, 80, 60, .35);
    opacity: 0; pointer-events: none; transition: transform .42s cubic-bezier(.3, .8, .3, 1), opacity .25s;
  }
  #laser.on { opacity: 1; }
  .blk.spot::after {
    content: ""; position: absolute; inset: -10px -14px; border-radius: 12px; pointer-events: none;
    box-shadow: 0 0 0 1px rgba(255, 106, 94, .35), 0 0 30px -6px rgba(255, 106, 94, .3);
    animation: spot .6s ease;
  }
  @keyframes spot { from { opacity: 0; transform: scale(.985); } to { opacity: 1; transform: none; } }
  .sec.dim { opacity: .38; transition: opacity .3s; }

  /* lecture reveal */
  body.lecturing .blk:not(.seen) { opacity: 0; transform: translateY(8px); pointer-events: none; }
  body.lecturing .blk.seen { opacity: 1; transform: none; }

  /* ---------- fold ---------- */
  body.folded .sec[data-level]:not([data-level="1"]) { display: none; }
  body.folded .blk { display: none; }
  body.folded .sec[data-level="1"] .sec-summary { display: block; }
  body.folded .sec[data-level="1"] { margin-top: 26px; }
  body.folded h2.sec-title { cursor: pointer; }
  body.folded h2.sec-title::after { content: "  +"; color: var(--ink-faint); font-size: 14px; }

  /* ---------- quiz ---------- */
  #quiz { margin: 56px 0 0; padding-top: 26px; border-top: 1px solid var(--line); }
  #quiz h2 { font-family: var(--serif); font-size: 22px; margin: 0 0 14px; }
  #quiz details { border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; background: var(--paper-raised); }
  #quiz summary { cursor: pointer; font-weight: 600; font-size: 14.5px; }
  #quiz details p { margin: 10px 0 0; color: var(--ink-soft); font-family: var(--serif); font-size: 15px; }

  .foot { margin-top: 60px; padding-top: 18px; border-top: 1px solid var(--line-soft); font-size: 11.5px; color: var(--ink-faint); display: flex; gap: 14px; flex-wrap: wrap; }
  .foot code { font-family: var(--mono); }

  /* ---------- bar ---------- */
  .bar {
    position: fixed; z-index: 45; left: 50%; bottom: 18px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 6px; padding: 7px 9px;
    background: rgba(255, 255, 255, .92); backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow);
  }
  .bar button {
    height: 32px; min-width: 32px; padding: 0 11px; border-radius: 999px; border: 1px solid transparent;
    background: transparent; color: var(--ink-soft); font-size: 12.5px; font-family: var(--sans); cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px; transition: background .15s, color .15s;
  }
  .bar button:hover { background: rgba(27, 27, 33, .06); color: var(--ink); }
  .bar button.primary { background: var(--ink); color: #fff; padding: 0 15px; }
  .bar button.primary:hover { background: #000; }
  .bar button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); }
  .bar .sep { width: 1px; height: 20px; background: var(--line); margin: 0 3px; }
  .bar .pos { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); min-width: 46px; text-align: center; }
  .bar select { border: 1px solid var(--line); border-radius: 8px; height: 28px; font-size: 12px; background: #fff; color: var(--ink-soft); padding: 0 4px; }
  /* The voice picker is a long list of names: keep it from stretching the pill. */
  .bar select#voiceName { max-width: 118px; }
  .bar { max-width: calc(100vw - 20px); overflow-x: auto; scrollbar-width: none; }
  .bar::-webkit-scrollbar { display: none; }

  /* ---------- responsive ---------- */
  @media (max-width: 1080px) {
    :root { --rail: 0px; }
    .rail { transform: translateX(-100%); transition: transform .25s; width: 280px; }
    body.rail-open .rail { transform: none; box-shadow: 0 0 60px rgba(0, 0, 0, .12); }
    main { margin-left: 0; padding: 30px 22px 150px; }
    h1.title { font-size: 31px; }
    .blk.md-body { font-size: 16px; }
  }
  @media print {
    .rail, .bar, #laser, #citecard { display: none !important; }
    main { margin: 0; padding: 0; }
    body.lecturing .blk { opacity: 1 !important; transform: none !important; }
    .cite { border-color: #bbb; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="rail-brand"><b>unfold</b><span>讲义</span></div>
    <div class="rail-goal" id="railGoal"></div>
    <div class="depth">
      <span>折叠</span>
      <button data-depth="1" title="只看一级标题">1</button>
      <button data-depth="2" title="展开到二级">2</button>
      <button data-depth="3" title="展开到三级">3</button>
      <button data-depth="4" title="全部展开">4</button>
    </div>
    <nav id="toc"></nav>
    <div class="rail-foot" id="railFoot"></div>
  </aside>

  <main>
    <div class="page">
      <header class="cover">
        <div class="kicker"><i></i>read · plan · write · lecture</div>
        <h1 class="title" id="title"></h1>
        <p class="subtitle" id="subtitle"></p>
        <div class="banner" id="banner"></div>
        <div class="route" id="routeBox"></div>
      </header>
      <article id="board"></article>
      <section id="quiz" hidden>
        <h2>讲完之后，自己答一遍</h2>
        <div id="quizList"></div>
      </section>
      <div class="foot">
        <span>由 unfold 生成 · <!--UNFOLD:BUILT--></span>
        <span id="footDocs"></span>
        <span><code>← →</code> 翻页 · <code>空格</code> 讲课</span>
      </div>
    </div>
  </main>
</div>

<div id="citecard" role="dialog" aria-label="原文引用">
  <div class="cc-head"><b class="cc-doc"></b><span class="cc-page"></span><span class="sp"></span><span class="cc-hint">原 PDF</span></div>
  <div class="cc-img"></div>
  <p class="cc-quote"></p>
</div>
<div id="laser"></div>

<div class="bar">
  <button id="play" class="primary"><span id="playIcon">▶</span> 讲课</button>
  <button id="prev" title="上一段">‹</button>
  <span class="pos" id="pos">—</span>
  <button id="next" title="下一段">›</button>
  <div class="sep"></div>
  <button id="voice" aria-pressed="true" title="朗读讲义">🔊</button>
  <button id="pet" aria-pressed="true" title="让大肥鱼当老师，弹出知识点">🐟</button>
  <div class="sep"></div>
  <button id="fold" title="折叠成提纲">提纲</button>
  <button id="expand" title="全部展开">展开</button>
  <select id="voiceName" title="朗读音色"></select>
  <select id="speed" title="讲课速度">
    <option value="0.75">0.75×</option>
    <option value="1" selected>1×</option>
    <option value="1.35">1.35×</option>
    <option value="2">2×</option>
  </select>
</div>

<script id="data" type="application/json"><!--UNFOLD:DATA--></script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("data").textContent);
  var STORE_KEY = "unfold:" + (DATA.title || "note");
  var saved = {};
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch (e) { saved = {}; }

  var state = {
    depth: saved.depth || 4,
    folded: !!saved.folded,
    playing: false,
    voice: saved.voice !== false,
    voiceName: saved.voiceName || null,
    pet: saved.pet !== false,
    index: -1,
    beats: DATA.lecture || [],
    blocks: [],
    byBlock: {},
    activeCite: null
  };

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        depth: state.depth, folded: state.folded, voice: state.voice,
        voiceName: state.voiceName, pet: state.pet
      }));
    } catch (e) {}
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* ---------- markdown-lite ---------- */
  function bindCite(node, index) {
    if (index == null || index < 0) return node;
    node.setAttribute("data-cite", String(index));
    node.addEventListener("mouseenter", function () { showCite(parseInt(this.getAttribute("data-cite"), 10), this); });
    node.addEventListener("mouseleave", hideCiteSoon);
    node.addEventListener("click", function (ev) { ev.preventDefault(); showCite(parseInt(this.getAttribute("data-cite"), 10), this); });
    return node;
  }

  function inline(text, cites) {
    var out = document.createElement("span");
    var pattern = /(\*\*[^*]+\*\*|\*[^*]+\*|`[^`]+`|\$[^$]+\$|\[[^\]]+\]\([^)]+\)|\[\^?\d+\])/g;
    var last = 0, m;
    while ((m = pattern.exec(text)) !== null) {
      if (m.index > last) out.appendChild(document.createTextNode(text.slice(last, m.index)));
      var tok = m[0], node;
      if (tok.slice(0, 2) === "**") { node = el("strong", null, tok.slice(2, -2)); }
      else if (tok[0] === "`") { node = el("code", null, tok.slice(1, -1)); }
      else if (tok[0] === "$") { node = el("span", "math-i", tok.slice(1, -1)); }
      else if (tok[0] === "*") { node = el("em", null, tok.slice(1, -1)); }
      else if (tok[0] === "[") {
        if (tok.indexOf("](") > 0) {
          var parts = tok.slice(1, -1).split("](");
          node = el("a", null, parts[0]);
          node.href = parts[1];
          node.target = "_blank";
          node.rel = "noreferrer";
        } else {
          var num = tok.replace(/[\[\]^]/g, "");
          var idx = parseInt(num, 10) - 1;
          node = el("span", "cite", num);
          bindCite(node, cites && cites.length ? cites[idx] : -1);
        }
      }
      if (node) out.appendChild(node);
      last = pattern.lastIndex;
    }
    if (last < text.length) out.appendChild(document.createTextNode(text.slice(last)));
    return out;
  }

  function blockNode(block, cites) {
    var kind = block.kind || "p";
    var wrap = el("div", "blk");
    wrap.setAttribute("data-id", block.id);
    var parts = String(block.md || "").split(/\n{1,}/).filter(function (s) { return s.trim().length > 0; });

    if (kind === "key" || kind === "def" || kind === "ask" || kind === "note") {
      wrap.className += " kind-" + kind + " md-body";
      var tag = el("span", "tag", kind === "key" ? "记住这一点" : kind === "def" ? "定义" : kind === "ask" ? "停下来想一想" : "旁注");
      wrap.appendChild(tag);
      parts.forEach(function (line) {
        var p = el(kind === "note" ? "div" : "p");
        p.appendChild(inline(line, cites));
        wrap.appendChild(p);
      });
    } else if (kind === "list") {
      wrap.className += " md-body";
      var ul = el("ul");
      parts.forEach(function (line) {
        var li = el("li");
        li.appendChild(inline(line.replace(/^[-*•]\s*/, ""), cites));
        ul.appendChild(li);
      });
      wrap.appendChild(ul);
    } else if (kind === "code") {
      wrap.className += " md-body";
      var pre = el("pre");
      pre.appendChild(document.createTextNode(String(block.md || "").trim()));
      wrap.appendChild(pre);
    } else if (kind === "quote") {
      wrap.className += " md-body";
      var bq = el("blockquote");
      bq.appendChild(inline(String(block.md || "").trim(), cites));
      wrap.appendChild(bq);
    } else if (kind === "formula") {
      wrap.className += " md-body";
      var f = el("div", "formula");
      f.appendChild(inline(String(block.md || "").trim(), cites));
      wrap.appendChild(f);
    } else {
      wrap.className += " md-body";
      parts.forEach(function (line) {
        var p = el("p");
        p.appendChild(inline(line, cites));
        wrap.appendChild(p);
      });
    }
    if (block.note) {
      var n = el("div", "kind-note");
      n.appendChild(inline(block.note, cites));
      wrap.appendChild(n);
    }
    // No inline [1] markers in the prose, but the block does carry evidence: put the chips at the end
    // rather than dropping the screenshots on the floor.
    if (cites && cites.length && !/\[\^?\d+\]/.test(String(block.md || ""))) {
      var line = el("div", "cite-line");
      line.appendChild(document.createTextNode("原文 "));
      cites.forEach(function (index, i) {
        var chip = el("span", "cite", String(i + 1));
        line.appendChild(bindCite(chip, index));
      });
      wrap.appendChild(line);
    }
    return wrap;
  }

  /* ---------- render ---------- */
  var docById = {};
  (DATA.docs || []).forEach(function (d) { docById[d.id] = d; });
  var citeIndex = {};
  (DATA.crops || []).forEach(function (c, i) { citeIndex[i] = c; });

  function render() {
    document.getElementById("title").textContent = DATA.title || "笔记";
    document.title = DATA.title || "笔记";
    var sub = document.getElementById("subtitle");
    if (DATA.subtitle) sub.textContent = DATA.subtitle; else sub.remove();

    var banner = document.getElementById("banner");
    if (DATA.start) { var p1 = el("span", "pill"); p1.innerHTML = "<b>起点</b> "; p1.appendChild(document.createTextNode(DATA.start)); banner.appendChild(p1); }
    if (DATA.goal) { var p2 = el("span", "pill accent"); p2.innerHTML = "<b>目标</b> "; p2.appendChild(document.createTextNode(DATA.goal)); banner.appendChild(p2); }
    var pages = (DATA.docs || []).reduce(function (n, d) { return n + (d.pages || 0); }, 0);
    if (DATA.docs && DATA.docs.length) { var p3 = el("span", "pill"); p3.textContent = DATA.docs.length + " 篇原文 · " + pages + " 页"; banner.appendChild(p3); }
    if (state.beats.length) { var p4 = el("span", "pill amber"); p4.textContent = state.beats.length + " 段讲课"; banner.appendChild(p4); }

    document.getElementById("railGoal").textContent = DATA.goal ? "目标：" + DATA.goal : (DATA.subtitle || "一份够用的讲义");
    var footDocs = document.getElementById("footDocs");
    footDocs.textContent = (DATA.docs || []).map(function (d) { return d.title; }).join(" · ");
    document.getElementById("railFoot").innerHTML = "<b>" + (DATA.sections || []).length + "</b> 节 · <b>" + (DATA.docs || []).length + "</b> 篇原文<br>每一处引用都能对回原页";

    if (DATA.path && DATA.path.length) {
      var box = document.getElementById("routeBox");
      box.appendChild(el("h3", null, "最短路线"));
      var ol = el("ol");
      DATA.path.forEach(function (step) {
        var li = el("li");
        li.appendChild(document.createTextNode(step.title || ""));
        if (step.why) { var s = el("small", null, step.why); li.appendChild(s); }
        ol.appendChild(li);
      });
      box.appendChild(ol);
    } else {
      document.getElementById("routeBox").remove();
    }

    var board = document.getElementById("board");
    var toc = document.getElementById("toc");
    var tocOl = el("ol");
    toc.appendChild(tocOl);

    (DATA.sections || []).forEach(function (sec) {
      var s = el("section", "sec");
      s.setAttribute("data-level", String(sec.level || 1));
      s.id = "sec-" + sec.id;
      var head = el("div", "sec-head");
      var h = el("h2", "sec-title", sec.title);
      head.appendChild(h);
      s.appendChild(head);
      if (sec.summary) s.appendChild(el("p", "sec-summary", sec.summary));
      (sec.blocks || []).forEach(function (block) {
        var node = blockNode(block, block.cites && block.cites.length ? block.cites.map(function (c) { return c.crop == null ? -1 : c.crop; }) : null);
        s.appendChild(node);
        state.blocks.push(node);
        state.byBlock[block.id] = node;
      });
      board.appendChild(s);

      var li = el("li");
      var a = el("a", "lv-" + (sec.level || 1), sec.title);
      a.href = "#sec-" + sec.id;
      a.addEventListener("click", function (ev) {
        ev.preventDefault();
        if (state.playing) stop();
        s.scrollIntoView({ behavior: "smooth", block: "start" });
        s.classList.add("spot");
        setTimeout(function () { s.classList.remove("spot"); }, 700);
      });
      li.appendChild(a);
      tocOl.appendChild(li);
    });

    var quiz = document.getElementById("quiz");
    if (DATA.quiz && DATA.quiz.length) {
      quiz.hidden = false;
      var list = document.getElementById("quizList");
      DATA.quiz.forEach(function (item, i) {
        var d = el("details");
        var sum = el("summary", null, (i + 1) + ". " + item.q);
        d.appendChild(sum);
        d.appendChild(el("p", null, item.a));
        list.appendChild(d);
      });
    }
    applyDepth();
    applyFold();
    observe();
  }

  /* ---------- outline / depth ---------- */
  function applyDepth() {
    document.querySelectorAll("#toc a").forEach(function (a) {
      var lv = parseInt(a.className.replace(/\D/g, ""), 10) || 1;
      a.style.display = lv <= state.depth ? "" : "none";
    });
    document.querySelectorAll(".depth button").forEach(function (b) {
      b.setAttribute("aria-pressed", String(parseInt(b.getAttribute("data-depth"), 10) === state.depth));
    });
    save();
  }

  function applyFold() {
    document.body.classList.toggle("folded", state.folded);
    document.getElementById("fold").setAttribute("aria-pressed", String(state.folded));
  }

  function observe() {
    if (!("IntersectionObserver" in window)) return;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        var id = e.target.id;
        document.querySelectorAll("#toc a.on").forEach(function (a) { a.classList.remove("on"); });
        var link = document.querySelector('#toc a[href="#' + id + '"]');
        if (link) link.classList.add("on");
      });
    }, { rootMargin: "-15% 0px -75% 0px" });
    document.querySelectorAll(".sec").forEach(function (s) { io.observe(s); });
  }

  /* ---------- citation card ---------- */
  var card = document.getElementById("citecard");
  var hideTimer = null;
  function showCite(index, anchor) {
    var c = citeIndex[index];
    if (!c) return;
    clearTimeout(hideTimer);
    if (state.activeCite && state.activeCite !== index) {
      document.querySelectorAll(".cite.on").forEach(function (n) { n.classList.remove("on"); });
    }
    state.activeCite = index;
    if (anchor) anchor.classList.add("on");
    var d = docById[c.doc];
    card.querySelector(".cc-doc").textContent = d ? d.title : c.doc;
    card.querySelector(".cc-page").textContent = "p." + c.page;
    var imgBox = card.querySelector(".cc-img");
    imgBox.innerHTML = "";
    if (c.png) {
      var img = document.createElement("img");
      img.src = "data:image/png;base64," + c.png;
      img.alt = (d ? d.title : c.doc) + " 第 " + c.page + " 页原文截图";
      imgBox.appendChild(img);
    } else {
      var miss = el("div", null, "这一页没有渲染出截图，下面给出原文。");
      miss.style.color = "var(--ink-faint)";
      miss.style.fontSize = "12.5px";
      imgBox.appendChild(miss);
    }
    var q = card.querySelector(".cc-quote");
    q.textContent = c.quote ? "“" + c.quote + "”" : "";
    card.classList.add("on");
    var r = anchor ? anchor.getBoundingClientRect() : { left: 200, top: 200, width: 0, bottom: 220 };
    var w = Math.min(600, window.innerWidth - 32);
    var left = Math.min(Math.max(16, r.left - w * 0.42), window.innerWidth - w - 16);
    var cardH = card.offsetHeight || 320;
    var top = r.bottom + 10;
    if (top + cardH > window.innerHeight - 16) top = Math.max(16, r.top - cardH - 10);
    card.style.width = w + "px";
    card.style.left = left + "px";
    card.style.top = top + "px";
  }
  function hideCiteSoon() {
    hideTimer = setTimeout(function () {
      card.classList.remove("on");
      document.querySelectorAll(".cite.on").forEach(function (n) { n.classList.remove("on"); });
      state.activeCite = null;
    }, 160);
  }
  card.addEventListener("mouseenter", function () { clearTimeout(hideTimer); });
  card.addEventListener("mouseleave", hideCiteSoon);

  /* ---------- lecture ---------- */
  var laser = document.getElementById("laser");
  var posEl = document.getElementById("pos");
  var playBtn = document.getElementById("play");
  var timer = null;

  function beatIndexForNode(node) {
    for (var i = 0; i < state.beats.length; i += 1) {
      if (state.byBlock[state.beats[i].block] === node) return i;
    }
    return -1;
  }

  /* ---------- speech ----------
     The lecture is read by Edge's neural voices through the DSH bridge, which is what makes it sound
     like a person rather than a screen reader. If the bridge is missing or the network is down, the
     browser's own speech engine takes over, so a note still talks offline. */
  var speech = { seq: 0, audio: null, url: null, pending: false, cache: {} };

  function speedValue() {
    return parseFloat(document.getElementById("speed").value) || 1;
  }

  function selectedVoice() {
    var sel = document.getElementById("voiceName");
    var value = "";
    if (sel) {
      try { value = sel.value || ""; } catch (e) { value = ""; }
      if (!value && sel.options) {
        for (var i = 0; i < sel.options.length; i += 1) {
          var opt = sel.options[i];
          if (opt.selected || opt.hasAttribute("selected")) { value = opt.value; break; }
        }
      }
    }
    if (value) return value;
    return (DATA.tts && DATA.tts.voice) || "browser";
  }

  function stopSpeech() {
    speech.seq += 1;
    speech.pending = false;
    if (speech.audio) {
      try { speech.audio.pause(); } catch (e) {}
      speech.audio.onended = null;
      speech.audio.onerror = null;
      speech.audio = null;
    }
    if (speech.url) {
      try { URL.revokeObjectURL(speech.url); } catch (e) {}
      speech.url = null;
    }
    if (typeof speechSynthesis !== "undefined") { try { speechSynthesis.cancel(); } catch (e) {} }
  }

  function browserSpeak(text, rate, done) {
    if (typeof speechSynthesis === "undefined") { if (done) done(); return; }
    try {
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "zh-CN";
      u.rate = Math.min(2, Math.max(0.5, rate));
      var voices = speechSynthesis.getVoices() || [];
      var wanted = selectedVoice();
      var pick = null;
      if (wanted && wanted !== "browser") {
        voices.forEach(function (v) { if (!pick && v.name === wanted) pick = v; });
      }
      if (!pick) {
        var zh = voices.filter(function (v) { return /^zh/i.test(v.lang) || /Chinese/i.test(v.name); });
        pick = zh.length ? zh[0] : null;
      }
      if (pick) u.voice = pick;
      u.onend = function () { if (done) done(); };
      speechSynthesis.speak(u);
    } catch (e) { if (done) done(); }
  }

  function playAudio(blob, text, rate, done) {
    var url = URL.createObjectURL(blob);
    var audio = new Audio(url);
    speech.audio = audio;
    speech.url = url;
    audio.onended = function () { if (done) done(); };
    audio.onerror = function () { browserSpeak(text, rate, done); };
    var started = audio.play();
    if (started && typeof started.catch === "function") {
      started.catch(function () { browserSpeak(text, rate, done); });
    }
  }

  // Say one beat. `done` fires when the audio ends, and drives the lecture forward.
  function speak(text, done) {
    stopSpeech();
    if (!state.voice || !text) { if (done) done(); return; }
    var seq = speech.seq;
    var rate = speedValue();
    var voice = selectedVoice();
    if (!DATA.tts || !voice || voice === "browser") { browserSpeak(text, rate, done); return; }
    var key = voice + "|" + rate + "|" + text;
    if (speech.cache[key]) { playAudio(speech.cache[key], text, rate, done); return; }
    speech.pending = true;
    fetch(DATA.tts.url + "/tts", {
      method: "POST",
      headers: { "content-type": "application/json", "x-unfold-token": DATA.tts.token },
      body: JSON.stringify({ text: text, voice: voice, rate: rate })
    }).then(function (res) {
      if (!res.ok) throw new Error("tts " + res.status);
      return res.blob();
    }).then(function (blob) {
      if (seq !== speech.seq) return;
      speech.pending = false;
      speech.cache[key] = blob;
      playAudio(blob, text, rate, done);
    }).catch(function () {
      if (seq !== speech.seq) return;
      speech.pending = false;
      browserSpeak(text, rate, done);
    });
  }

  function petSay(beat) {
    if (!state.pet || !DATA.bridge || !beat) return;
    var payload = { text: beat.say || "", anim: beat.anim || null, block: beat.block };
    try {
      fetch(DATA.bridge.url + "/teach", {
        method: "POST",
        headers: { "content-type": "application/json", "x-unfold-token": DATA.bridge.token },
        body: JSON.stringify(payload),
        keepalive: true
      }).catch(function () {});
    } catch (e) {}
  }

  function petStop() {
    if (!DATA.bridge) return;
    try {
      fetch(DATA.bridge.url + "/stop", {
        method: "POST",
        headers: { "content-type": "application/json", "x-unfold-token": DATA.bridge.token },
        body: "{}",
        keepalive: true
      }).catch(function () {});
    } catch (e) {}
  }

  function focusBeat(i, opts) {
    var beat = state.beats[i];
    if (!beat) return;
    var node = state.byBlock[beat.block];
    if (!node) return;
    state.index = i;
    document.body.classList.add("lecturing");
    if (state.folded) { state.folded = false; applyFold(); }
    // reveal everything up to this beat
    for (var k = 0; k <= i; k += 1) {
      var n = state.byBlock[state.beats[k].block];
      if (n) n.classList.add("seen");
    }
    document.querySelectorAll(".blk.spot").forEach(function (n) { n.classList.remove("spot"); });
    node.classList.add("spot");
    node.scrollIntoView({ behavior: "smooth", block: "center" });
    var r = node.getBoundingClientRect();
    laser.style.transform = "translate(" + Math.max(10, r.left - 16) + "px," + (r.top + Math.min(30, r.height / 2)) + "px)";
    laser.classList.add("on");
    posEl.textContent = i + 1 + " / " + state.beats.length;
    if (!opts || opts.speak !== false) speak(beat.say, function () { advanceFrom(i); });
    if (!opts || opts.pet !== false) petSay(beat);
    if (state.playing) scheduleNext();
  }

  // The audio for beat i finished: move on, unless the reader already moved somewhere else.
  function advanceFrom(i) {
    if (!state.playing || state.index !== i) return;
    clearTimeout(timer);
    if (i + 1 < state.beats.length) focusBeat(i + 1);
    else stop();
  }

  function beatDuration(beat) {
    var speed = parseFloat(document.getElementById("speed").value) || 1;
    var chars = (beat.say || "").length;
    var ms = Math.min(22000, Math.max(4200, chars * 210));
    return ms / speed;
  }

  function scheduleNext() {
    clearTimeout(timer);
    var beat = state.beats[state.index];
    if (!beat) return;
    // A backstop only: normally the end of the spoken audio moves the lecture along. While the
    // audio is still being fetched we cannot know its length, so give it plenty of room.
    var extra = speech.audio || speech.pending ? 20000 : 0;
    timer = setTimeout(function () {
      if (!state.playing) return;
      if (state.index + 1 < state.beats.length) focusBeat(state.index + 1);
      else stop();
    }, beatDuration(beat) + extra);
  }

  function play() {
    if (!state.beats.length) return;
    state.playing = true;
    playBtn.innerHTML = '<span id="playIcon">❚❚</span> 暂停';
    document.getElementById("playIcon");
    if (state.index < 0) focusBeat(0); else focusBeat(state.index);
  }
  function stop() {
    state.playing = false;
    clearTimeout(timer);
    playBtn.innerHTML = '<span id="playIcon">▶</span> 讲课';
    stopSpeech();
    petStop();
  }
  function toggle() { if (state.playing) stop(); else play(); }

  // Voices come from the host (`/voice` at build time, so this works with the note offline). The
  // browser's own engine stays on the list as the fallback entry.
  function fillVoices() {
    var sel = document.getElementById("voiceName");
    if (!sel) return;
    var menu = (DATA.tts && DATA.tts.voices) || [];
    var browser = document.createElement("option");
    browser.value = "browser";
    browser.textContent = "浏览器自带声音";
    if (!DATA.tts) {
      sel.appendChild(browser);
      pickVoiceOption(sel, "browser");
      sel.title = "这份讲义生成时没接上 DSH，只能使用浏览器自带的声音";
      return;
    }
    menu.forEach(function (v) {
      var opt = document.createElement("option");
      opt.value = v.id;
      opt.textContent = v.tag ? v.name + "（" + v.tag + "）" : v.name;
      sel.appendChild(opt);
    });
    var wanted = state.voiceName || (DATA.tts && DATA.tts.voice) || "";
    var found = false;
    for (var i = 0; i < sel.options.length; i += 1) if (sel.options[i].value === wanted) found = true;
    if (!found && wanted) {
      // A voice configured on the host but not in the menu: still offer it, so it stays selected.
      var extra = document.createElement("option");
      extra.value = wanted;
      extra.textContent = wanted.replace(/^[a-z]{2}-[A-Z]{2}-/, "").replace(/Neural$/, "") + "（自定义）";
      sel.appendChild(extra);
    }
    sel.appendChild(browser);
    pickVoiceOption(sel, wanted || "browser");
    sel.title = "朗读音色（默认云健；可选 " + menu.length + " 个在线音色或浏览器自带声音）";
  }

  // Mark an option as the selected one. The `selected` attribute is what browsers and simple DOM
  // implementations both honour; assigning the `.value` property is skipped because a few DOM
  // implementations expose it read-only.
  function pickVoiceOption(sel, value) {
    var match = null;
    var index = -1;
    for (var i = 0; i < sel.options.length; i += 1) {
      var opt = sel.options[i];
      if (opt.value === value) {
        match = opt;
        index = i;
        opt.setAttribute("selected", "selected");
      } else {
        opt.removeAttribute("selected");
      }
    }
    if (index >= 0) {
      try { sel.selectedIndex = index; } catch (e) {}
    }
    return match;
  }

  /* ---------- wiring ---------- */
  playBtn.addEventListener("click", toggle);
  document.getElementById("prev").addEventListener("click", function () {
    if (state.index > 0) focusBeat(state.index - 1, { pet: true });
    else if (state.beats.length) focusBeat(0, { pet: true });
  });
  document.getElementById("next").addEventListener("click", function () {
    if (state.index + 1 < state.beats.length) focusBeat(state.index + 1, { pet: true });
  });
  document.getElementById("fold").addEventListener("click", function () {
    state.folded = !state.folded;
    applyFold(); save();
  });
  document.getElementById("expand").addEventListener("click", function () {
    state.folded = false;
    applyFold();
    document.body.classList.remove("lecturing");
    document.querySelectorAll(".blk").forEach(function (n) { n.classList.add("seen"); });
    laser.classList.remove("on");
    state.index = -1;
    posEl.textContent = "—";
    stop(); save();
  });
  document.getElementById("voice").addEventListener("click", function () {
    state.voice = !state.voice;
    this.setAttribute("aria-pressed", String(state.voice));
    this.textContent = state.voice ? "🔊" : "🔇";
    if (!state.voice) stopSpeech();
    save();
  });
  document.getElementById("voiceName").addEventListener("change", function () {
    state.voiceName = selectedVoice();
    save();
    // Re-read the beat being lectured in the new voice straight away.
    if (state.playing && state.index >= 0) focusBeat(state.index);
  });
  document.getElementById("pet").addEventListener("click", function () {
    state.pet = !state.pet;
    this.setAttribute("aria-pressed", String(state.pet));
    this.title = state.pet ? "大肥鱼会弹出知识点" : "已关闭大肥鱼联动";
    save();
  });
  if (!DATA.bridge) {
    var petBtn = document.getElementById("pet");
    petBtn.disabled = true;
    petBtn.style.opacity = ".4";
    petBtn.title = "这份讲义生成时没有接上大肥鱼（DSH 未运行或已关闭联动）";
  }
  document.getElementById("speed").addEventListener("change", function () { save(); });
  document.querySelectorAll(".depth button").forEach(function (b) {
    b.addEventListener("click", function () {
      state.depth = parseInt(this.getAttribute("data-depth"), 10);
      applyDepth();
    });
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.target && /input|select|textarea/i.test(ev.target.tagName)) return;
    if (ev.code === "Space") { ev.preventDefault(); toggle(); }
    else if (ev.key === "ArrowRight") { document.getElementById("next").click(); }
    else if (ev.key === "ArrowLeft") { document.getElementById("prev").click(); }
    else if (ev.key === "Escape") { stop(); laser.classList.remove("on"); }
  });
  window.addEventListener("scroll", function () {
    if (state.playing) return;
    // keep the laser glued to the active block while the reader scrolls manually
    var beat = state.beats[state.index];
    if (!beat) return;
    var node = state.byBlock[beat.block];
    if (!node) return;
    var r = node.getBoundingClientRect();
    if (r.bottom < 0 || r.top > window.innerHeight) { laser.classList.remove("on"); return; }
    laser.classList.add("on");
    laser.style.transform = "translate(" + Math.max(10, r.left - 16) + "px," + (r.top + Math.min(30, r.height / 2)) + "px)";
  }, { passive: true });

  render();
  fillVoices();
  document.getElementById("voice").setAttribute("aria-pressed", String(state.voice));
  document.getElementById("voice").textContent = state.voice ? "🔊" : "🔇";
  document.getElementById("pet").setAttribute("aria-pressed", String(state.pet));
  if (!state.voice) document.getElementById("voice").textContent = "🔇";
  if (state.folded) applyFold();
})();
</script>
</body>
</html>
